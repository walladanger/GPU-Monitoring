name: Windows application
on:
  push:
    branches: [main]
    paths: ['src/GpuMonitor/**', 'tests/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['src/GpuMonitor/**', 'tests/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telemetry-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify parser and inventory without NVIDIA hardware
        run: dotnet run --project tests/GpuMonitor.TelemetryChecks -c Release
  package:
    needs: telemetry-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/GpuMonitor/GpuMonitor.csproj -c Release
      - name: Verify discovery and native panel behavior
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Application checks failed' }
          Get-Content (Join-Path (Split-Path $exe) 'self-test-result.txt')
      - name: Publish runtime-bundled ZIP
        shell: pwsh
        run: ./src/GpuMonitor/packaging/Build-Package.ps1
      - name: Verify backend collection without a dashboard
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $output = Join-Path $env:RUNNER_TEMP 'gpu-headless'
          $process = Start-Process $exe -ArgumentList @('--collect', $output, '--duration', '6', '--interval', '1') -PassThru
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Backend shutdown timed out' }
          if ($process.ExitCode -ne 0) { throw 'Backend collection failed' }
          $sources = Get-Content (Join-Path $output 'telemetry.json') -Raw | ConvertFrom-Json
          $sources | Select-Object Source, Health, Error | ConvertTo-Json
          $system = $sources | Where-Object Source -eq 'windows-system'
          if ($system.Health -ne 'Live') { throw 'Windows system collector is not live' }
          $ram = $system.Current.Samples | Where-Object MetricKey -eq 'ram.total'
          $cpu = $system.History | Where-Object { $_.MetricKey -eq 'cpu.usage' -and $null -ne $_.Value }
          if ($ram.Value -le 0 -or $cpu.Count -lt 1) { throw 'Missing measured CPU/RAM telemetry' }
          $disks = $sources | Where-Object Source -eq 'windows-disks'
          $diskRead = $disks.History | Where-Object { $_.MetricKey -eq 'disk.read' -and $null -ne $_.Value }
          if ($disks.Health -ne 'Live' -or $diskRead.Count -lt 1) { throw 'Missing physical disk throughput samples' }
          $processes = $sources | Where-Object Source -eq 'windows-processes'
          if ($processes.Health -ne 'Live' -or -not ($processes.Current.Devices | Where-Object DisplayIndex -eq $process.Id)) { throw 'Collector process missing from inventory' }
          if (-not (Test-Path (Join-Path $output 'telemetry.csv'))) { throw 'Missing CSV export' }
          Get-Content (Join-Path $output 'telemetry.txt')
      - name: Verify native overview charts and capture fixture screenshots
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--verify-overview' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Overview verification timed out' }
          $result = Join-Path (Split-Path $exe) 'overview-verification/result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0) { throw 'Overview verification failed' }
          if (-not (Test-Path $result)) { throw 'Overview verification produced no result' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPU-Monitor-Overview-Verification
          path: src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/overview-verification/
          if-no-files-found: warn
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup is missing from the Windows runner' }
          & $compiler src/GpuMonitor/packaging/GpuMonitor.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-Monitor-Windows-x64
          path: |
            src/GpuMonitor/GPU-Monitor-Windows-x64.zip
            src/GpuMonitor/artifacts/GPU-Monitor-Setup.exe
          if-no-files-found: error
