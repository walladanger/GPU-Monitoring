name: Windows application
on:
  push:
    branches: [main]
    paths: ['src/GpuMonitor/**', 'tests/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['src/GpuMonitor/**', 'tests/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telemetry-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify parser and inventory without NVIDIA hardware
        run: dotnet run --project tests/GpuMonitor.TelemetryChecks -c Release
  package:
    needs: telemetry-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/GpuMonitor/GpuMonitor.csproj -c Release
      - name: Verify SGLang and vLLM adapters over real loopback HTTP on Windows
        run: dotnet run --project tests/GpuMonitor.TelemetryChecks -c Release
      - name: Verify native overview charts and capture fixture screenshots
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--verify-overview' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Overview verification timed out' }
          $result = Join-Path (Split-Path $exe) 'overview-verification/result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0) { throw 'Overview verification failed' }
          if (-not (Test-Path $result)) { throw 'Overview verification produced no result' }
      - name: Verify discovery and native panel behavior
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Application checks failed' }
          Get-Content (Join-Path (Split-Path $exe) 'self-test-result.txt')
      - name: Publish runtime-bundled ZIP
        shell: pwsh
        run: |
          ./src/GpuMonitor/packaging/Build-Package.ps1
          if (-not (Test-Path 'src/GpuMonitor/publish/config/sglang-vllm.sources.json')) { throw 'Packaged SGLang/vLLM preset missing' }
          if (-not (Test-Path 'src/GpuMonitor/publish/config/SGLang-vLLM-README.txt')) { throw 'Packaged adapter instructions missing' }
          if (-not (Test-Path 'src/GpuMonitor/publish/config/llamacpp.sources.json')) { throw 'Packaged llama.cpp preset missing' }
      - name: Verify backend collection without a dashboard
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $output = Join-Path $env:RUNNER_TEMP 'gpu-headless'
          $feed = Join-Path $env:RUNNER_TEMP 'gpu-usage-fixture.jsonl'
          @{ id = 'fixture-request'; timestamp = (Get-Date).ToUniversalTime().ToString('o'); model = 'fixture-model'; durationMs = 2000; usage = @{ prompt_tokens = 100; completion_tokens = 20 }; messages = 'SECRET_FIXTURE_CONTENT' } | ConvertTo-Json -Compress -Depth 5 | Set-Content $feed
          $config = Join-Path $env:RUNNER_TEMP 'gpu-sources-fixture.json'
          @{ Version = 1; CollectCpuCores = $true; Feeds = @(@{ Enabled = $true; Id = 'fixture'; Kind = 'usage'; Path = $feed }) } | ConvertTo-Json -Depth 5 | Set-Content $config
          $process = Start-Process $exe -ArgumentList @('--collect', $output, '--duration', '6', '--interval', '1', '--sources', $config) -PassThru
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Backend shutdown timed out' }
          if ($process.ExitCode -ne 0) { throw 'Backend collection failed' }
          $sources = Get-Content (Join-Path $output 'telemetry.json') -Raw | ConvertFrom-Json
          $sources | Select-Object Source, Health, Error | ConvertTo-Json
          $system = $sources | Where-Object Source -eq 'windows-system'
          if ($system.Health -ne 'Live') { throw 'Windows system collector is not live' }
          $ram = $system.Current.Samples | Where-Object MetricKey -eq 'ram.total'
          $cpu = $system.History | Where-Object { $_.MetricKey -eq 'cpu.usage' -and $null -ne $_.Value }
          if ($ram.Value -le 0 -or $cpu.Count -lt 1) { throw 'Missing measured CPU/RAM telemetry' }
          $cores = $sources | Where-Object Source -eq 'windows-cpu-cores'
          $coreUsage = @($cores.History | Where-Object { $_.MetricKey -eq 'cpu.core.usage' -and $null -ne $_.Value })
          if ($cores.Health -ne 'Live' -or $coreUsage.Count -lt 1) { throw 'Missing measured logical CPU samples' }
          $disks = $sources | Where-Object Source -eq 'windows-disks'
          $diskRead = $disks.History | Where-Object { $_.MetricKey -eq 'disk.read' -and $null -ne $_.Value }
          if ($disks.Health -ne 'Live' -or $diskRead.Count -lt 1) { throw 'Missing physical disk throughput samples' }
          $processes = $sources | Where-Object Source -eq 'windows-processes'
          if ($processes.Health -ne 'Live' -or -not ($processes.Current.Devices | Where-Object DisplayIndex -eq $process.Id)) { throw 'Collector process missing from inventory' }
          $usage = $sources | Where-Object Source -eq 'usage:fixture'
          if ($usage.Health -ne 'Live' -or $usage.EventHistory.Count -ne 1) { throw 'Configured usage adapter did not ingest its fixture' }
          if ((Get-Content (Join-Path $output 'telemetry.json') -Raw).Contains('SECRET_FIXTURE_CONTENT')) { throw 'Metadata export retained excluded content' }
          if (-not (Test-Path (Join-Path $output 'events.csv'))) { throw 'Missing event/measurement CSV export' }
          if (-not (Test-Path (Join-Path $output 'telemetry.csv'))) { throw 'Missing CSV export' }
          Get-Content (Join-Path $output 'telemetry.txt')
      - name: Verify target acceptance validation logic
        shell: pwsh
        run: |
          ./tests/acceptance/TargetAcceptanceChecks.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/acceptance/TargetAcceptanceChecks.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5 acceptance checks failed' }
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup is missing from the Windows runner' }
          & $compiler src/GpuMonitor/packaging/GpuMonitor.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify packaged acceptance runner on GPU-free Windows CI
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/publish/GpuMonitor.exe
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./src/GpuMonitor/publish/Validate-GpuMonitor.ps1 -Executable $exe -ExpectedGpuCount 0 -DurationSeconds 6 -OutputRoot (Join-Path $env:RUNNER_TEMP 'GPU validation with spaces')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged acceptance runner failed' }
      - name: Verify actual dashboard engine lifecycle
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--verify-monitoring' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Dashboard engine verification timed out' }
          $result = Join-Path (Split-Path $exe) 'monitoring-verification.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Dashboard engine verification failed' }
      - name: Verify native workspace controls and preset recovery
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--verify-workspace' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'Workspace verification timed out' }
          $result = Join-Path (Split-Path $exe) 'overview-verification/workspace-result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Workspace verification failed' }
      - name: Verify independent chart axes, time navigation and raw exports
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--verify-charts' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Chart interaction verification timed out' }
          $result = Join-Path (Split-Path $exe) 'overview-verification/charts-result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Chart interaction verification failed' }
      - name: Verify persistent SQLite history and native saved-history browser
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--verify-persistence' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'Persistence verification timed out' }
          $result = Join-Path (Split-Path $exe) 'overview-verification/persistence-result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Persistence verification failed' }
      - name: Verify native tray quick-view settings, bindings and placement
        shell: pwsh
        run: |
          $exe = Resolve-Path src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/GpuMonitor.exe
          $process = Start-Process $exe -ArgumentList '--verify-tray' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Tray verification timed out' }
          $result = Join-Path (Split-Path $exe) 'overview-verification/tray-result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Tray verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPU-Monitor-Overview-Verification
          path: src/GpuMonitor/bin/Release/net10.0-windows10.0.19041.0/overview-verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPU-Monitor-Target-Validation-CI
          path: ${{ runner.temp }}/GPU validation with spaces/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-Monitor-Windows-x64
          path: |
            src/GpuMonitor/GPU-Monitor-Windows-x64.zip
            src/GpuMonitor/artifacts/GPU-Monitor-Setup.exe
          if-no-files-found: error
