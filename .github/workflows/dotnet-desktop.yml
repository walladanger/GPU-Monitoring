# Compiles the WPF app in both configurations on every change.
# windows-build.yml owns the native self-test, packaging and the single installer;
# this workflow replaces the unconfigured GitHub template (placeholder solution
# paths, .NET 8, MSIX signing secrets) that could never pass.
name: .NET Core Desktop
on:
  push:
    branches: [main]
    paths: ['src/GpuMonitor/**', 'tests/**', '.github/workflows/dotnet-desktop.yml']
  pull_request:
    branches: [main]
    paths: ['src/GpuMonitor/**', 'tests/**', '.github/workflows/dotnet-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF application
        run: dotnet build src/GpuMonitor/GpuMonitor.csproj -c ${{ matrix.configuration }}
